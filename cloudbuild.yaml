steps:
  # Build frontend
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$_TAG
      - ./app/frontend

  # Build details
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$_TAG
      - ./app/details

  # Build Pinger v1
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v1
      - ./app/pinger/v1

  # Build Pinger v2
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v2
      - ./app/pinger/v2

  # Push images
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$_TAG

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$_TAG

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v1

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v2

  # Create a Cloud Deploy release after all image pushes succeed
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - deploy
      - releases
      - create
      - pinger-$_TAG
      - --delivery-pipeline=pinger-pipeline
      - --region=asia-south1
      - --project=$PROJECT_ID
      - --source=.
      - --images=frontend=asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$_TAG,details=asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$_TAG,pinger-v1=asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v1,pinger-v2=asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v2

images:
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$_TAG
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$_TAG
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v1
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$_TAG-v2

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
