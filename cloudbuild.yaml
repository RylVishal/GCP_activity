
steps:
  # Build frontend
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$SHORT_SHA
      - ./app/frontend

  # Build details
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$SHORT_SHA
      - ./app/details

  # Build Pinger v1
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$SHORT_SHA-v1
      - ./app/pinger/v1

  # Build Pinger v2
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$SHORT_SHA-v2
      - ./app/pinger/v2

  # Push frontend
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$SHORT_SHA

  # Push details
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$SHORT_SHA

  # Push Pinger v1
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$SHORT_SHA-v1

  # Push Pinger v2
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$SHORT_SHA-v2

  # Create Cloud Deploy release
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env:
      - PROJECT_ID=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - SHORT_SHA=$SHORT_SHA
    args:
      - -ceu
      - |
        RELEASE_ID="pinger-$${SHORT_SHA}-$$(printf '%s' "$${BUILD_ID}" | cut -c1-8)"

        gcloud deploy releases create "$${RELEASE_ID}" \
          --delivery-pipeline=pinger-pipeline \
          --region=asia-south1 \
          --project="$${PROJECT_ID}" \
          --source=. \
          --images="frontend=asia-south2-docker.pkg.dev/$${PROJECT_ID}/app-images/frontend:$${SHORT_SHA},details=asia-south2-docker.pkg.dev/$${PROJECT_ID}/app-images/details:$${SHORT_SHA},pinger-v1=asia-south2-docker.pkg.dev/$${PROJECT_ID}/app-images/pinger:$${SHORT_SHA}-v1,pinger-v2=asia-south2-docker.pkg.dev/$${PROJECT_ID}/app-images/pinger:$${SHORT_SHA}-v2"

# Images produced by this build
images:
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/frontend:$SHORT_SHA
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/details:$SHORT_SHA
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$SHORT_SHA-v1
  - asia-south2-docker.pkg.dev/$PROJECT_ID/app-images/pinger:$SHORT_SHA-v2

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
